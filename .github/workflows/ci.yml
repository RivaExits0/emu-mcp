name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-x86-64-linux-gnu binutils
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mcp>=1.0" unicorn capstone lief pytest
      - name: Run test suite
        run: make test
      - name: Run demo
        run: python examples/demo.py
